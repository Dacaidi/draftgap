name: Build Windows Installer

on:
    workflow_dispatch:
    push:
        branches:
            - feature/local-rank-datasets

jobs:
    build-windows:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: apps/frontend/src-tauri -> target

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.6

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build unsigned NSIS installer
              working-directory: apps/frontend
              run: bunx tauri build --bundles nsis --no-sign

            - name: Upload Windows installer
              uses: actions/upload-artifact@v4
              with:
                  name: draftgap-windows-installer
                  path: apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
                  if-no-files-found: error
