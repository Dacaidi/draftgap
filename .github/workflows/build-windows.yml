name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-typescript:
    name: Validate TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspaces
        run: bun typecheck

      - name: Run tests
        run: bun test

      - name: Lint frontend
        run: bun run --filter @draftgap/frontend lint

  validate-windows:
    name: Validate Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/frontend/src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run --filter @draftgap/frontend build

      - name: Check Rust formatting
        working-directory: apps/frontend/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: apps/frontend/src-tauri
        run: cargo test --locked

  build-windows:
    name: Build unsigned Windows installer
    needs:
      - validate-typescript
      - validate-windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/frontend/src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned NSIS installer
        working-directory: apps/frontend
        run: bunx tauri build --bundles nsis --no-sign

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: draftgap-windows-installer-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
