name: "Update hosted rank datasets"

on:
  schedule:
    # Local Finnish morning, including automatic summer/winter time changes.
    # GitHub schedules are best-effort and may start later than this time.
    - cron: "17 9 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    name: "Generate ${{ matrix.tier }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tier:
          - gold
          - gold_plus
          - platinum
          - platinum_plus
          - emerald
          - emerald_plus
          - diamond
          - diamond_plus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate dataset files
        working-directory: apps/dataset
        run: >-
          bun run generate-hosted
          "${{ matrix.tier }}"
          "${{ runner.temp }}/hosted-dataset"

      - name: Upload generated tier
        uses: actions/upload-artifact@v7
        with:
          name: "rank-dataset-${{ matrix.tier }}"
          path: "${{ runner.temp }}/hosted-dataset"
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: true

  deploy:
    name: "Deploy datasets to GitHub Pages"
    needs: generate
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Download and verify all generated tiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/collect-dataset-artifacts.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package GitHub Pages artifact
        id: package
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ steps.package.outputs.artifact_id }}
        with:
          script: |
            const deploy = require('./scripts/deploy-dataset-pages.cjs');
            await deploy({ github, context, core }, process.env.PAGES_ARTIFACT_ID);
